# Deploy do ContratoIA na VPS, atrás do Traefik do Coolify (coolify-proxy).
#
# Uso na VPS (em /home/ubuntu/apps/contratoia, com este arquivo e o .env fora
# do repositório e o clone em ./repo):
#
#   docker compose up -d --build
#
# Entrypoints e certresolver seguem o padrão do coolify-proxy: http/https e
# letsencrypt via HTTP challenge, rede externa "coolify".

services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* é embutido no bundle durante o build, não lido em runtime
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: contratoia-web
    restart: unless-stopped
    env_file: .env
    # permite alcançar uma LLM instalada no host (AI_PROVIDER=local):
    # LOCAL_LLM_URL="http://10.0.2.1:11434"  (gateway da rede coolify)
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # http -> redireciona para https
      - "traefik.http.routers.contratoia-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.contratoia-http.entrypoints=http"
      - "traefik.http.routers.contratoia-http.middlewares=contratoia-redirect"
      - "traefik.http.routers.contratoia-http.service=contratoia"
      - "traefik.http.middlewares.contratoia-redirect.redirectscheme.scheme=https"
      # https com certificado do Let's Encrypt
      - "traefik.http.routers.contratoia.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.contratoia.entrypoints=https"
      - "traefik.http.routers.contratoia.tls=true"
      - "traefik.http.routers.contratoia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.contratoia.service=contratoia"
      - "traefik.http.services.contratoia.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
